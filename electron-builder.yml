appId: com.nexusvault.app
productName: Nexus Vault
copyright: "Copyright 2026 Jesse Lugo"
directories:
  output: dist
files:
  - out/**
  - package.json
  - "!**/*.map"
# The index process (utilityProcess) and the modules it loads run from app.asar.unpacked.
asarUnpack:
  - out/main/index-host.js
  - out/main/chunks/**
  - node_modules/chokidar/**
  - node_modules/readdirp/**
  - node_modules/minisearch/**
publish: null
win:
  target:
    - target: nsis
      arch: [x64]
  signAndEditExecutable: false
mac:
  # Unsigned (ad-hoc) build: no Apple Developer ID, no notarization.
  # First launch: right-click the app > Open.
  target:
    - target: dmg
      arch: [universal]
    - target: zip
      arch: [universal]
  category: public.app-category.productivity
  identity: "-"
  hardenedRuntime: false
  gatekeeperAssess: false
  notarize: false
  artifactName: "Nexus-Vault-${version}-macOS-universal.${ext}"
dmg:
  artifactName: "Nexus-Vault-${version}-macOS-universal.${ext}"
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Office
  maintainer: "Nexus Vault Contributors"
  synopsis: "Local-first knowledge management"
appImage:
  artifactName: "Nexus-Vault-${version}-Linux-x86_64.${ext}"
deb:
  artifactName: "Nexus-Vault-${version}-Linux-amd64.${ext}"
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  runAfterFinish: true
  artifactName: "Nexus-Vault-Setup-${version}.${ext}"
