appId: com.nexusvault.app
productName: Nexus Vault
copyright: "Copyright 2026 Jesse Lugo"
directories:
  output: dist
files:
  - out/**
  - package.json
  - "!**/*.map"
win:
  target:
    - target: nsis
      arch: [x64]
  signAndEditExecutable: false
linux:
  target: dir
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  runAfterFinish: true
  artifactName: "Nexus-Vault-Setup-${version}.${ext}"
